name: Deploy to Cloudflare Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # wrangler bundles cloudflare/index.ts with esbuild and resolves
      # @cloudflare/containers from node_modules.
      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships a running Docker daemon; wrangler builds the
      # image from ./Dockerfile and pushes it to Cloudflare's registry.
      - name: Deploy Worker + Container image
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
